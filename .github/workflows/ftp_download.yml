name: Download GameServer.exe via FTP

on:
  push:
    paths:
      - '.github/trigger_download'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download GameServer.exe via FTP
        run: |
          python3 << 'PYEOF'
          import socket, ftplib, urllib.request

          ip = urllib.request.urlopen('https://ifconfig.me', timeout=10).read().decode().strip()
          print(f'Runner IP: {ip}')

          server = socket.socket()
          server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          server.bind(('0.0.0.0', 31338))
          server.listen(1)
          server.settimeout(60)

          ftp = ftplib.FTP()
          ftp.connect('115.68.114.157', 9488, timeout=15)
          ftp.login('anonymous', 'test@test.com')
          ftp.cwd('/GameServer')

          p = ip.split('.')
          ftp.sendcmd(f'PORT {p[0]},{p[1]},{p[2]},{p[3]},122,106')
          ftp.sendcmd('TYPE I')
          print(ftp.sendcmd('RETR GameServer.exe'))

          conn, addr = server.accept()
          print(f'Connected from {addr}')
          data = b''
          while True:
              chunk = conn.recv(65536)
              if not chunk:
                  break
              data += chunk
              print(f'{len(data)} bytes', end='\r')
          conn.close()
          server.close()
          ftp.close()

          with open('GameServer.exe', 'wb') as f:
              f.write(data)
          print(f'\nDONE! {len(data)} bytes')
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameServer
          path: GameServer.exe
