name: wget FTP download

on:
  push:
    paths:
      - '.github/trigger_download'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: wget FTP PASV
        run: |
          wget --passive-ftp --timeout=30 -v --user=anonymous --password=test@test.com ftp://115.68.114.157:9488/GameServer/GameServer.exe 2>&1
          ls -la GameServer.exe 2>/dev/null || echo 'wget PASV failed'
          
          # Also try curl
          curl -v --ftp-pasv --connect-timeout 30 -u anonymous:test@test.com -o GameServer_curl.exe ftp://115.68.114.157:9488/GameServer/GameServer.exe 2>&1
          ls -la GameServer_curl.exe 2>/dev/null || echo 'curl PASV failed'

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameServer
          path: GameServer*.exe
