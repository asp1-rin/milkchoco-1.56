name: Download GameServer.exe via FTP (PASV mode)

on:
  push:
    paths:
      - '.github/trigger_download'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: PASV mode download
        run: |
          python3 << 'PYEOF'
          import ftplib, urllib.request

          ip = urllib.request.urlopen('https://ifconfig.me', timeout=10).read().decode().strip()
          print(f'Runner IP: {ip}')

          ftp = ftplib.FTP()
          ftp.connect('115.68.114.157', 9488, timeout=30)
          print(ftp.getwelcome())
          ftp.login('anonymous', 'test@test.com')
          ftp.cwd('/GameServer')
          ftp.set_pasv(True)

          files = ftp.nlst()
          print(f'Files: {files}')

          # Try PASV download
          with open('GameServer.exe', 'wb') as f:
              def callback(data):
                  f.write(data)
                  nonlocal sz
                  sz[0] += len(data)
                  if sz[0] % 1048576 == 0:
                      print(f'{sz[0]//1048576} MB', end=' ')
              sz = [0]
              try:
                  ftp.retrbinary('RETR GameServer.exe', callback)
                  print(f'\nDONE! {sz[0]} bytes')
              except Exception as e:
                  print(f'\nPASV failed: {e}')
                  # Fallback: try EPRT (IPv6-style PORT)
                  ftp.sendcmd('EPRT |1|{{REPLACE_IP}}|31338|')  # Will be replaced below
                  ftp.set_pasv(False)
          ftp.close()
          PYEOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameServer
          path: GameServer.exe
